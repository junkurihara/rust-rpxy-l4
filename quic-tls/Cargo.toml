[package]
name = "rpxy-l4-quic-tls"
description = "Library to probe TLS and QUIC initial packets"
version.workspace = true
edition.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
# traces and logs
tracing = { version = "0.1.44" }

# error handling
anyhow = { version = "1.0.104" }
thiserror = { version = "2.0.19" }

# quic parser
hkdf = { version = "0.13.0" }
sha2 = { version = "0.11.0" }
aes = { version = "0.9.1" }
aes-gcm = { version = "0.11.0" }
hex-literal = { version = "1.1.0" }

# ech
bytes = { version = "1.12.1" }
rand = { version = "0.10.2" }
base64 = { version = "0.22.1" }
hpke = { version = "0.14.0", default-features = false, features = [
  "aes",
  "nistp",
  "x25519",
  "alloc",
  "getrandom",
] }

[dev-dependencies]
rustls = { version = "0.23.42" }
